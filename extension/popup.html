<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KAVACH Shield</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0a0a0f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(225, 29, 72, 0.2);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .title {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-text {
      font-size: 12px;
      color: #94a3b8;
    }
    .status-val {
      font-size: 14px;
      font-weight: 600;
      color: #22c55e;
      margin-top: 4px;
    }
    .scan-btn {
      width: 100%;
      background: linear-gradient(135deg, #e11d48, #be123c);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      padding: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge" id="shieldStatus"></div>
    <div class="title">KAVACH SHIELD</div>
  </div>
  <div class="status-card">
    <div class="status-text">Active Tab Security</div>
    <div class="status-val" id="currentDomain">Checking...</div>
  </div>
  <button class="scan-btn" id="deepScanBtn">Deep Scan Current Page</button>
  <script src="popup.js"></script>
</body>
</html>
